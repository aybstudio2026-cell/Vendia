<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <!-- Gradiente Cyan Eléctrico -->
    <linearGradient id="favCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#38E1FF" />
    </linearGradient>

    <!-- Gradiente Esmeralda a Cyan -->
    <linearGradient id="favArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="35%" stop-color="#00E676" />
      <stop offset="70%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#38E1FF" />
    </linearGradient>

    <!-- Gradiente Verde Esmeralda -->
    <linearGradient id="favWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00C853" />
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00E5FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <g transform="translate(9, 14)" filter="url(#favGlow)">
    <!-- Base derecha / Chevron 'V' -->
    <polygon points="212,10 188,10 105,146 75,100 66,108 96,163 116,163" fill="url(#favCyan)" />

    <!-- Zigzag central ascendente con flecha -->
    <polygon points="160,15 133,27 139,34 105,83 82,51 50,90 58,102 82,75 105,114 149,43 158,44" fill="url(#favArrow)" />

    <!-- Ala geométrica superior izquierda -->
    <polygon points="10,28 68,28 77,43 68,54 58,43 38,43 54,69 43,81" fill="url(#favWing)" />
  </g>
</svg>